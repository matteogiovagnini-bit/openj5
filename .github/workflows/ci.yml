name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Lint platform, robot core and tests
        run: ruff check src/ firmware/node1_robot_core/docker/src/ tests/

  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest==9.1.1 pytest-cov==7.1.0
      - name: Run unit tests with coverage gate
        run: pytest tests/unit -q --cov=core.domain --cov-report=term-missing --cov-fail-under=90

  doc-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mandatory documents
        run: ./scripts/check_docs.sh

  docker-build:
    name: Docker Build (robot-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build robot-core image
        run: >
          docker build
          -f firmware/node1_robot_core/docker/Dockerfile.robot-core
          -t openj5-robot-core:ci
          firmware/node1_robot_core/docker

  firmware-host-tests:
    name: Firmware Host Tests (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run pure firmware logic tests
        run: ./scripts/test/host_firmware.sh

  firmware-node7-build:
    name: Firmware Build (node7_balance, ESP-IDF)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build node7 balance firmware with ESP-IDF v5.2
        run: >
          docker run --rm
          -v "$PWD:/project"
          -w /project/firmware/node7_balance
          espressif/idf:v5.2.2
          bash -c "idf.py set-target esp32s3 && idf.py build"
