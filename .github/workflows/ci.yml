name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.4
      - name: Lint platform and robot core
        run: ruff check src/ firmware/node1_robot_core/docker/src/

  doc-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify mandatory documents
        run: ./scripts/check_docs.sh

  docker-build:
    name: Docker Build (robot-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build robot-core image
        run: >
          docker build
          -f firmware/node1_robot_core/docker/Dockerfile.robot-core
          -t openj5-robot-core:ci
          firmware/node1_robot_core/docker
