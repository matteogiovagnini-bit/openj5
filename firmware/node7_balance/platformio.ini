; OpenJ5 Node 7 Balance - build/flash da VSCode + PlatformIO
;
; Equivalente PlatformIO del progetto ESP-IDF: usa gli STESSI CMakeLists.txt,
; Kconfig.projbuild, sdkconfig.defaults (+ sdkconfig.local non committato).
; Non serve clonare ESP-IDF a mano: la prima volta `pio run` scarica
; piattaforma, toolchain e framework (circa 1 GB in ~/.platformio).
;
; VERSIONI - da tenere sincronizzate con .github/workflows/ci.yml:
;   - piattaforma espressif32 6.12.x -> framework-espidf ~3.50500.x = ESP-IDF v5.5.x
;   - CI (job firmware-node7-build)   -> container espressif/idf:v5.2.2
; Il codice deve restare buildabile su ENTRAMBE le versioni (niente API
; esclusive di una sola): se si aumenta una, aumentare anche l'altra.

[platformio]
src_dir = main                 ; struttura ESP-IDF standard (docs: frameworks/espidf)
default_envs = node7

[env:node7]
platform = platformio/espressif32 @ 6.12.0
board = esp32-s3-devkitc-1     ; ESP32-S3 DevKitC-1 (JSON = N8/8 MB)
; Il modulo reale del banco e' da 4 MB: senza questo override PlatformIO
; genera bootloader.bin e firmware.bin con header 8 MB e il chip da 4 MB
; va in assert all'avvio ("Detected size(4096k) smaller than the size in
; the binary image header(8192k)"). Tenere allineato a
; CONFIG_ESPTOOLPY_FLASHSIZE_4MB di sdkconfig.local (il default in
; sdkconfig.defaults resta 8 MB per le board N8).
board_upload.flash_size = 4MB
framework = espidf
monitor_speed = 115200         ; UART0 console (default ESP-IDF)

; Porta seriale: l'autodetect basta se c'e' un solo device collegato;
; altrimenti decommentare (esempio macOS, v. README "Procedimento di
; caricamento"):
; upload_port = /dev/cu.usbmodem1101
; monitor_port = /dev/cu.usbmodem1101
