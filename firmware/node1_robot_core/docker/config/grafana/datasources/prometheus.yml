# OpenJ5 Grafana Datasource - Prometheus
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: openj5-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: "POST"

  - name: Loki
    type: loki
    uid: openj5-loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "correlation_id"
          type: "string"
          matcherRegex: 'correlation_id[= ]+([\w\-]+)'
          url: '$${__value.raw}'
