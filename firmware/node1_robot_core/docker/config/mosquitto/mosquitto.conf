# OpenJ5 Mosquitto MQTT Broker Configuration
# mTLS required for all clients

# General
pid_file /var/run/mosquitto.pid
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Security
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/acl

# mTLS Listener (port 8883)
listener 8883
protocol mqtt
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
cafile /mosquitto/certs/ca.crt
tls_version tlsv1.3
require_certificate true
use_identity_as_username true

# TCP Listener (localhost only, port 1883)
listener 1883
protocol mqtt
bind_interface lo
allow_anonymous true

# WebSocket Listener (port 9001)
listener 9001
protocol websockets
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
cafile /mosquitto/certs/ca.crt
tls_version tlsv1.3
require_certificate true
use_identity_as_username true

# MQTT v5 features
maximum_packet_size 1048576
max_inflight_messages 20
max_queued_messages 200
max_keepalive 60

# Bridge
bridge_protocol_version mqttv311

# QoS
set_tcp_nodelay true
websockets_heartbeat_interval 30
