# OpenJ5 Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    robot: openj5
    node: robot_core

# Alerting
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: 'openj5-robot-core'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['robot-core:9090']
        labels:
          node: 'node1'
          service: 'robot-core'

  - job_name: 'openj5-nodes'
    scrape_interval: 15s
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          - 'node2-head:9090'
          - 'node3-right-arm:9090'
          - 'node4-left-arm:9090'
          - 'node5-torso:9090'
          - 'node6-tracks:9090'
        labels:
          service: 'firmware-node'

  - job_name: 'openj5-mosquitto'
    scrape_interval: 30s
    static_configs:
      - targets: ['mosquitto:1883']
        labels:
          service: 'mqtt'

  - job_name: 'openj5-gazebo'
    scrape_interval: 30s
    static_configs:
      - targets: ['gazebo:9862']
        labels:
          service: 'simulation'

  - job_name: 'openj5-redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'eventbus'

  - job_name: 'openj5-postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres:9187']
        labels:
          service: 'database'

  - job_name: 'openj5-otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'observability'
