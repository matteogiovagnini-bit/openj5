# OpenJ5 ROS2 Bridge Parameters
rosbridge_websocket:
  ros__parameters:
    port: 9090
    address: "0.0.0.0"
    ssl: true
    certfile: "/certs/rosbridge.crt"
    keyfile: "/certs/rosbridge.key"
    max_message_size: 10485760
    fragment_timeout: 600
    delay_between_messages: 0
    max_client_count: 10
    send_buffer_limit: 104857600
    use_compression: true

    # Topic mapping
    topic_whitelist:
      - "/openj5/**"
      - "/joint_states"
      - "/tf"
      - "/tf_static"

    service_whitelist:
      - "/openj5/**"
